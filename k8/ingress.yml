apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: infra-monitor-dash-ingress
  namespace: infra-monitoring
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip

spec:
  ingressClassName: alb
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: infra-monitor-dash-service
            port:
              number: 8080


# You install the AWS Load Balancer Controller in your EKS cluster and configure its IAM permissions. Then, when you apply your ingress.yaml, 
# the controller automatically provisions the public ALB and its supporting AWS resources.

# 1.Create EKS cluster and worker nodes.
# 2.Create IAM policy and role for the controller, with the required trust relationship.
# 3.Install AWS Load Balancer Controller in EKS.
# 4.Apply your Ingress YAML with kubectl apply -f ingress.yaml.
# 5.AWS creates the ALB and configures its listeners, target group and routing.
# 6.Get the public URL using kubectl get ingress -n infra-monitoring.