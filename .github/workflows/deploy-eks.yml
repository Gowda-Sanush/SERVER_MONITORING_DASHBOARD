name: Deploy to EKS

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: eks-deploy-infra-monitoring-dashboard
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER_NAME: infra-monitoring-dashboard
  ECR_REPOSITORY: infra-monitoring/dashboard
  KUBERNETES_NAMESPACE: infra-monitoring

jobs:
  deploy:
    name: Create cluster and deploy dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install eksctl
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/eksctl-io/eksctl/releases/latest/download/eksctl_Linux_amd64.tar.gz" \
            --output /tmp/eksctl.tar.gz
          tar -xzf /tmp/eksctl.tar.gz -C /tmp
          sudo install /tmp/eksctl /usr/local/bin/eksctl
          eksctl version

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Create EKS cluster if it does not exist
        shell: bash
        run: |
          if aws eks describe-cluster \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "Cluster $EKS_CLUSTER_NAME already exists; keeping it."
          else
            eksctl create cluster --config-file eks-cluster.yml
          fi

      - name: Configure kubectl and associate the cluster OIDC provider
        shell: bash
        run: |
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"
          eksctl utils associate-iam-oidc-provider \
            --cluster "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --approve
          kubectl get nodes

