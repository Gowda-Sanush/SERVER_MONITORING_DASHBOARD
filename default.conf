server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        return 301 /app/;
    }

    location /app/ {
        alias /usr/share/nginx/html/app/;
        index index.html;
        try_files $uri $uri/ /app/index.html;
    }

    location /data/ {
        alias /usr/share/nginx/html/data/;
        autoindex on;
    }
}